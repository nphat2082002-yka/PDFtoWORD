[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word-vn"
version = "1.0.0"
description = "Clean-room Vietnamese PDF-to-DOCX converter with PaddleOCR + VietOCR and ABBYY-inspired OpenXML synthesis"
readme = "README.md"
authors = [{ name = "Huỳnh Ngọc Phát" }]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pdf2docx>=0.5.8",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.5.1.48",
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.7.3,<3.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "vietocr>=0.3.13",
    "einops>=0.2.0",
    "gdown>=4.4.0",
    "matplotlib>=3.5.0",
    "lmdb>=1.3.0",
    "prefetch-generator>=1.0.1",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pdf2word = "pdf2word.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2word*", "ui*"]

[tool.setuptools.package-data]
ui = ["assets/*"]
